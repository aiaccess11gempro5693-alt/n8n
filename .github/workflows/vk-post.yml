name: VK Post

# Публикация в сообщество ВК через API (песочница без прямого доступа в интернет).
# Логика — tools/vk_post.py на указанной ветке; результат коммитится в scratch/vk/.
# Секреты: VK_GROUP_TOKEN (ключ сообщества), необязательно VK_USER_TOKEN и VK_GROUP_ID.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка со скриптом и файлом поста'
        required: true
      mode:
        description: 'check — проверить ключи; post — опубликовать'
        required: true
        default: 'check'
      post_file:
        description: 'JSON поста (для mode=post)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  vk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Run
        env:
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python3 tools/vk_post.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.post_file }}"
      - name: Commit result
        if: always()
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scratch/vk || true
          git commit -m "scratch: VK result [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH" && break; sleep $((i*3)); done
