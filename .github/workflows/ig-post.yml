name: IG Post

# Публикация в Instagram через официальный API (песочница без прямого доступа в интернет).
# Логика — tools/ig_post.py на указанной ветке; результат коммитится в scratch/ig/.
# Секрет: IG_TOKEN (маркер доступа из приложения Meta).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка со скриптом и файлом поста'
        required: true
      mode:
        description: 'check — проверить ключ; post — опубликовать'
        required: true
        default: 'check'
      post_file:
        description: 'JSON поста (для mode=post)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_post.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.post_file }}"
      - name: Commit result
        if: always()
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scratch/ig || true
          git commit -m "scratch: IG result [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH" && break; sleep $((i*3)); done
