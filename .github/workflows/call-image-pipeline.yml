name: Call Image Pipeline (Gemini + Nano Banana)

# Прямой мост к CometAPI — замена воркера /image в n8n (n8n убран из
# архитектуры, см. CLAUDE.md, 14.09.2026).
#
# 14.09.2026 — переделано под ТЗ п.1/п.7: раньше промпт картинки и
# подпись на экране были двумя независимыми ручными решениями, никак
# не связанными друг с другом или с текстом диктора — отсюда жалоба
# "картинки не сочетаются со словами". Теперь единственный источник
# истины — narration_line (реплика диктора для этой сцены). Gemini
# ОДНИМ вызовом выводит из неё И промпт картинки, И подписи на экран
# (image_prompt + captions[]) — так что картинка и текст на экране
# гарантированно про одно и то же. QA-шаг в конце проверяет не
# "картинка соответствует своему же промпту" (это тавтология), а
# реальную согласованность: картинка + подписи + сама реплика диктора.
#
# 14.09.2026 (2) — добавлен опциональный reference_image_path: раньше
# консистентность стиля между картинками держалась только на повторении
# прилагательных в тексте промпта ("в том же стиле, что остальные
# карточки") — из-за этого первая попытка сцены 2 уехала в другой стиль
# (плоский клипарт вместо soft-3D). Теперь можно передать реальное
# эталонное изображение как image-референс в сам вызов Nano Banana —
# это устойчивее, чем текстовое описание "будь похож на X".
#
# Требуется repository secret COMETAPI_KEY (заголовок x-goog-api-key).

on:
  workflow_dispatch:
    inputs:
      narration_line:
        description: 'Точный текст реплики диктора для этой сцены (источник истины для картинки И подписей)'
        required: true
      scene_description:
        description: 'Краткий визуальный бриф сцены (тип сцены, что должно быть в кадре, стиль)'
        required: true
      caption_count:
        description: 'Сколько отдельных подписей на экране для этой сцены (1 — обычная сцена, 4 — сцена-список/карточки)'
        required: false
        default: '1'
      aspect_ratio:
        description: 'Соотношение сторон картинки'
        required: false
        default: '16:9'
        type: choice
        options:
          - '16:9'
          - '1:1'
          - '9:16'
          - '4:3'
          - '3:2'
      output_name:
        description: 'Имя файла в scratch/ (без расширения) — задавай уникальное при параллельных запросах'
        required: false
        default: 'image-output'
      reference_image_path:
        description: 'Путь к эталонному изображению стиля в репозитории (опционально) — передаётся в Nano Banana как image-референс вместо того, чтобы держаться только на словах в промпте'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  call-image-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline (derive prompt+captions from narration -> generate image -> coherence QA)
        env:
          COMETAPI_KEY: ${{ secrets.COMETAPI_KEY }}
          NARRATION_LINE: ${{ github.event.inputs.narration_line }}
          SCENE_DESCRIPTION: ${{ github.event.inputs.scene_description }}
          CAPTION_COUNT: ${{ github.event.inputs.caption_count }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
          OUTPUT_NAME: ${{ github.event.inputs.output_name }}
          REFERENCE_IMAGE_PATH: ${{ github.event.inputs.reference_image_path }}
        run: |
          if [ -z "$COMETAPI_KEY" ]; then
            echo "::error::Секрет COMETAPI_KEY не задан в настройках репозитория"
            exit 1
          fi
          mkdir -p scratch
          python3 -c "
          import json, os, re, urllib.request, urllib.error, base64, sys

          API_KEY = os.environ['COMETAPI_KEY']
          NARRATION = os.environ['NARRATION_LINE']
          SCENE = os.environ['SCENE_DESCRIPTION']
          CAPTION_COUNT = int(os.environ.get('CAPTION_COUNT') or '1')
          ASPECT_RATIO = os.environ.get('ASPECT_RATIO') or '16:9'
          NAME = os.environ.get('OUTPUT_NAME') or 'image-output'
          REF_PATH = os.environ.get('REFERENCE_IMAGE_PATH') or ''
          BASE = 'https://api.cometapi.com/v1beta/models'

          ref_b64 = None
          ref_mime = 'image/png'
          if REF_PATH:
              if not os.path.exists(REF_PATH):
                  print(f'::error::Референс-изображение не найдено: {REF_PATH}')
                  sys.exit(1)
              with open(REF_PATH, 'rb') as f:
                  ref_b64 = base64.b64encode(f.read()).decode('ascii')
              ref_mime = 'image/jpeg' if REF_PATH.lower().endswith(('.jpg', '.jpeg')) else 'image/png'
              print(f'--- Референс стиля подключён: {REF_PATH} ---')

          def call(model, body):
              url = f'{BASE}/{model}:generateContent'
              data = json.dumps(body).encode('utf-8')
              req = urllib.request.Request(url, data=data, method='POST', headers={
                  'x-goog-api-key': API_KEY,
                  'content-type': 'application/json',
              })
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return resp.status, json.loads(resp.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  body_text = e.read().decode('utf-8', errors='replace')
                  print(f'::error::HTTP {e.code} from {model}: {body_text[:1000]}')
                  sys.exit(1)

          def extract_text(resp):
              parts = (resp.get('candidates') or [{}])[0].get('content', {}).get('parts', [])
              return ''.join(p.get('text', '') for p in parts).strip()

          def extract_json(text):
              # Модель иногда оборачивает JSON в \`\`\`json ... \`\`\` — снимаем обёртку
              cleaned = re.sub(r'^\`\`\`(json)?|\`\`\`\$', '', text.strip(), flags=re.MULTILINE).strip()
              return json.loads(cleaned)

          # Шаг 1: ОДИН источник истины (реплика диктора) -> промпт картинки + подписи на экран
          plan_prompt = (
              'Ты арт-директор обучающих видео для фармацевтов. Тебе даётся РЕПЛИКА ДИКТОРА '
              'для одной сцены и краткий визуальный бриф. Твоя задача — вывести из этой '
              'реплики (а не придумывать отдельно) и промпт для генерации картинки, и текст, '
              'который появится на экране поверх видео. Картинка и подписи должны быть про '
              'ОДНО И ТО ЖЕ, что говорится в реплике — не про сценарий в целом, а именно про '
              'эту конкретную фразу.\n\n'
              f'Реплика диктора: \"{NARRATION}\"\n'
              f'Визуальный бриф сцены: {SCENE}\n'
              f'Нужно ровно {CAPTION_COUNT} подпис(ь/и/ей) на экран.\n\n'
              'Ответь СТРОГО в формате JSON без пояснений, без markdown-обёртки:\n'
              '{\n'
              '  \"image_prompt\": \"детальный промпт НА АНГЛИЙСКОМ для модели генерации изображений '
              '(стиль, освещение, композиция, ракурс) — картинка должна визуально иллюстрировать именно '
              'содержание реплики диктора, без текста и надписей на самой картинке\",\n'
              f'  \"captions\": [{CAPTION_COUNT} строк(и) на русском, короткие (2-5 слов каждая), '
              'взятые по смыслу прямо из реплики диктора, не выдуманные отдельно от неё]\n'
              '}'
          )
          status1, resp1 = call('gemini-3.5-flash', {'contents': [{'parts': [{'text': plan_prompt}]}]})
          plan_text = extract_text(resp1)
          if not plan_text:
              print('::error::Gemini не вернул план сцены. Ответ: ' + json.dumps(resp1)[:1000])
              sys.exit(1)
          try:
              plan = extract_json(plan_text)
              prompt = plan['image_prompt'].strip()
              captions = [str(c).strip() for c in plan['captions']]
          except Exception as e:
              print(f'::error::Не удалось разобрать JSON-план сцены ({e}). Сырой ответ: {plan_text[:1000]}')
              sys.exit(1)
          if len(captions) != CAPTION_COUNT:
              print(f'::warning::Ожидалось {CAPTION_COUNT} подписей, получено {len(captions)}: {captions}')
          print('--- Шаг 1: промпт картинки ---')
          print(prompt)
          print('--- Шаг 1: подписи на экран (из той же реплики) ---')
          print(captions)

          # Шаг 2: генерация картинки (Nano Banana). Если подключён референс
          # стиля — он идёт ПЕРВОЙ частью (image), затем текстовый промпт с
          # явной инструкцией повторить именно этот визуальный стиль.
          image_prompt_text = prompt
          parts_for_image = []
          if ref_b64:
              parts_for_image.append({'inline_data': {'mime_type': ref_mime, 'data': ref_b64}})
              image_prompt_text = (
                  'Match the exact visual style of the attached reference image — same '
                  'soft 3D clay-style rendering, same matte pastel material treatment, '
                  'same studio lighting and shadow softness, same warm background '
                  'gradient, same turquoise/coral accent palette. Do not copy the '
                  'reference\'s subject matter, only its visual style. New composition: '
                  + prompt
              )
          parts_for_image.append({'text': image_prompt_text})
          status2, resp2 = call('gemini-2.5-flash-image', {
              'contents': [{'parts': parts_for_image}],
              'generationConfig': {'responseModalities': ['IMAGE'], 'imageConfig': {'aspectRatio': ASPECT_RATIO}},
          })
          parts2 = (resp2.get('candidates') or [{}])[0].get('content', {}).get('parts', [])
          img_part = next((p for p in parts2 if p.get('inlineData', {}).get('data')), None)
          if not img_part:
              print('::error::Nano Banana не вернул изображение. Ответ: ' + json.dumps(resp2)[:1000])
              sys.exit(1)
          image_base64 = img_part['inlineData']['data']
          mime_type = img_part['inlineData'].get('mimeType', 'image/png')
          ext = 'png' if 'png' in mime_type else 'jpg'
          with open(f'scratch/{NAME}.{ext}', 'wb') as f:
              f.write(base64.b64decode(image_base64))
          print(f'--- Шаг 2: картинка сохранена в scratch/{NAME}.{ext} ---')

          # Шаг 3: проверка СОГЛАСОВАННОСТИ (не просто картинка<->свой промпт,
          # а картинка+подписи<->реплика диктора)
          captions_str = '; '.join(captions)
          qa_prompt = (
              f'Реплика диктора для этой сцены: \"{NARRATION}\".\n'
              f'Подписи, которые появятся на экране поверх этой картинки: {captions_str}.\n\n'
              'Оцени ДВЕ вещи и ответь коротко:\n'
              '1) Действительно ли изображение визуально иллюстрирует именно то, о чём говорит диктор '
              '(а не просто общую тему), нет ли артефактов.\n'
              '2) Логично ли смотрятся подписи вместе с этим изображением и репликой — не противоречат ли '
              'они друг другу.\n'
              'Ответь \"OK\" если всё согласовано, или одним-двумя предложениями опиши конкретную проблему.'
          )
          status3, resp3 = call('gemini-3.5-flash', {
              'contents': [{'parts': [
                  {'text': qa_prompt},
                  {'inline_data': {'mime_type': mime_type, 'data': image_base64}},
              ]}]
          })
          verdict = extract_text(resp3) or 'нет ответа от Gemini'
          print('--- Шаг 3: вердикт согласованности речь+картинка+подписи ---')
          print(verdict)

          with open(f'scratch/{NAME}.json', 'w') as f:
              json.dump({
                  'narration_line': NARRATION,
                  'prompt': prompt,
                  'reference_image_path': REF_PATH or None,
                  'captions': captions,
                  'mime_type': mime_type,
                  'verdict': verdict,
                  'aspect_ratio': ASPECT_RATIO,
              }, f, ensure_ascii=False, indent=2)
          print('--- Готово ---')
          print(json.dumps({'prompt': prompt, 'captions': captions, 'mime_type': mime_type, 'verdict': verdict}, ensure_ascii=False, indent=2))
          "

      - name: Commit response for inspection
        if: always()
        env:
          OUTPUT_NAME: ${{ github.event.inputs.output_name }}
        run: |
          NAME="${OUTPUT_NAME:-image-output}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "scratch/${NAME}.png" ] && git add "scratch/${NAME}.png"
          [ -f "scratch/${NAME}.jpg" ] && git add "scratch/${NAME}.jpg"
          [ -f "scratch/${NAME}.json" ] && git add "scratch/${NAME}.json"
          if ! git diff --cached --quiet; then
            git commit -m "scratch: image pipeline output ${NAME} for inspection [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push не удался, пробую перебазироваться и повторить..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Нечего коммитить"
          fi
