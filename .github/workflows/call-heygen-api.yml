name: Call HeyGen API

# Ручной запуск (workflow_dispatch) — вызывает HeyGen API напрямую
# (например, чтобы посмотреть список аватаров/голосов) с реального
# интернет-доступа раннера. Используется только для разовых
# GET-запросов при настройке (найти avatar_id/voice_id) — сами
# видео-воркеры дёргаются через call-n8n-worker.yml.
#
# Требуется repository secret HEYGEN_API_KEY — ключ HeyGen (header
# X-Api-Key). Добавляется вручную в
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Путь после https://api.heygen.com, например: /v2/avatars или /v2/video/generate'
        required: true
        default: '/v2/avatars'
      method:
        description: 'HTTP метод'
        required: true
        default: 'GET'
        type: choice
        options:
          - GET
          - POST
      body:
        description: 'JSON тело запроса (только для POST, можно оставить {})'
        required: false
        default: '{}'

permissions:
  contents: write

jobs:
  call-heygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call HeyGen API
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          PATH_INPUT: ${{ github.event.inputs.path }}
          METHOD: ${{ github.event.inputs.method }}
          BODY: ${{ github.event.inputs.body }}
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then
            echo "::error::Секрет HEYGEN_API_KEY не задан в настройках репозитория"
            exit 1
          fi
          URL="https://api.heygen.com${PATH_INPUT}"
          echo "Вызываю: $METHOD $URL"
          if [ "$METHOD" = "POST" ]; then
            curl -sS -X POST "$URL" -H "X-Api-Key: $HEYGEN_API_KEY" -H "Content-Type: application/json" -d "$BODY" -o scratch/heygen-response.json -w "\nHTTP_STATUS:%{http_code}\n"
          else
            curl -sS "$URL" -H "X-Api-Key: $HEYGEN_API_KEY" -o scratch/heygen-response.json -w "\nHTTP_STATUS:%{http_code}\n"
          fi

      - name: Preview response
        if: always()
        run: |
          python3 -c "
          import json
          try:
              with open('scratch/heygen-response.json') as f:
                  data = json.load(f)
          except Exception as e:
              print('Не JSON или пусто:', e)
          else:
              print(json.dumps(data, ensure_ascii=False, indent=2)[:3000])
          "

      - name: Download video if response has a video_url
        if: always()
        run: |
          VIDEO_URL=$(python3 -c "
          import json
          try:
              with open('scratch/heygen-response.json') as f:
                  data = json.load(f)
              print(data.get('data', {}).get('video_url', '') or '')
          except Exception:
              print('')
          ")
          if [ -n "$VIDEO_URL" ]; then
            echo "Скачиваю видео: $VIDEO_URL"
            curl -sS "$VIDEO_URL" -o scratch/latest-heygen-video.mp4
          else
            echo "В ответе нет video_url — нечего скачивать"
          fi

      - name: Commit response for inspection
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/heygen-response.json scratch/latest-heygen-video.mp4 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "scratch: latest HeyGen API response for inspection [skip ci]"
            git push
          else
            echo "Нечего коммитить"
          fi
