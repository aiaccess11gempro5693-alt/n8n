name: Call n8n worker

# Ручной запуск (workflow_dispatch) — вызывает один из наших n8n-воркеров
# (/tts, /image, /avatar-start, /avatar-status) с реальным доступом в интернет
# (в отличие от песочницы, где работает Claude Code) и сохраняет ответ
# как артефакт запуска, который потом можно скачать/прочитать.
#
# Требуется repository secret N8N_BASE_URL — базовый адрес n8n
# (например https://your-instance.app.n8n.cloud, БЕЗ конечного /), без
# путей вида /webhook/tts. Сам секрет добавляется вручную в
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  workflow_dispatch:
    inputs:
      worker_path:
        description: 'Путь после /webhook/, например: tts, image, avatar-start, avatar-status?video_id=XXX'
        required: true
      method:
        description: 'HTTP метод'
        required: true
        default: 'POST'
        type: choice
        options:
          - POST
          - GET
      payload:
        description: 'JSON тело запроса (для GET можно оставить {})'
        required: false
        default: '{}'
      output_name:
        description: 'Имя файла в scratch/ для сохранения результата (без расширения) — задавай уникальное, если запускаешь несколько сцен параллельно'
        required: false
        default: 'latest-worker-output'

permissions:
  contents: write

jobs:
  call-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call n8n webhook
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          WORKER_PATH: ${{ github.event.inputs.worker_path }}
          METHOD: ${{ github.event.inputs.method }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          if [ -z "$N8N_BASE_URL" ]; then
            echo "::error::Секрет N8N_BASE_URL не задан в настройках репозитория"
            exit 1
          fi
          URL="${N8N_BASE_URL%/}/webhook/${WORKER_PATH}"
          echo "Вызываю: $METHOD $URL"
          if [ "$METHOD" = "GET" ]; then
            curl -sS "$URL" -D response-headers.txt -o response-body.out -w "\nHTTP_STATUS:%{http_code}\n" | tee response-status.txt
          else
            curl -sS -X POST "$URL" -H "Content-Type: application/json" -d "$PAYLOAD" -D response-headers.txt -o response-body.out -w "\nHTTP_STATUS:%{http_code}\n" | tee response-status.txt
          fi
          echo "--- Response headers ---"
          cat response-headers.txt

      - name: Preview JSON response (no huge base64 dumps)
        if: always()
        run: |
          python3 -c "
          import json
          try:
              with open('response-body.out') as f:
                  data = json.load(f)
          except Exception as e:
              print('Тело ответа — не JSON или пустое:', e)
          else:
              def preview(v):
                  if isinstance(v, str) and len(v) > 200:
                      return v[:200] + f'... [{len(v)} chars total]'
                  return v
              if isinstance(data, dict):
                  print(json.dumps({k: preview(v) for k, v in data.items()}, ensure_ascii=False, indent=2))
              else:
                  print(json.dumps(data, ensure_ascii=False, indent=2)[:2000])
          "

      - name: Save any binary field (image_base64/audio_base64/video_url) into scratch/ and commit
        if: always()
        env:
          OUTPUT_NAME: ${{ github.event.inputs.output_name }}
        run: |
          python3 -c "
          import json, base64, os
          name = os.environ.get('OUTPUT_NAME') or 'latest-worker-output'
          try:
              with open('response-body.out') as f:
                  data = json.load(f)
          except Exception:
              raise SystemExit(0)
          if not isinstance(data, dict):
              raise SystemExit(0)
          os.makedirs('scratch', exist_ok=True)
          saved = False
          for key, ext in [('image_base64', 'png'), ('audio_base64', 'mp3')]:
              b64 = data.get(key)
              if isinstance(b64, str) and len(b64) > 100:
                  with open(f'scratch/{name}.{ext}', 'wb') as f:
                      f.write(base64.b64decode(b64))
                  saved = True
          video_url = data.get('video_url')
          if isinstance(video_url, str) and video_url.startswith('http'):
              with open('scratch/.video_url_to_fetch', 'w') as f:
                  f.write(video_url)
              saved = True
          print('Сохранено в scratch/' if saved else 'В ответе нет image_base64/audio_base64/video_url — нечего сохранять')
          "
          if [ -f scratch/.video_url_to_fetch ]; then
            VIDEO_URL=$(cat scratch/.video_url_to_fetch)
            echo "Скачиваю видео: $VIDEO_URL"
            curl -sS "$VIDEO_URL" -o "scratch/${OUTPUT_NAME:-latest-worker-output}.mp4"
            rm scratch/.video_url_to_fetch
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "scratch: latest worker output (${OUTPUT_NAME:-latest-worker-output}) for inspection [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push не удался (параллельный запуск?), пробую перебазироваться и повторить..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Нечего коммитить"
          fi

      - name: Upload result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-worker-result
          path: |
            response-body.out
            response-headers.txt
            response-status.txt
          retention-days: 7
